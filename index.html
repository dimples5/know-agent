<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">待办</h1>
        <p class="subtitle">记下一件事，做完就划掉</p>
      </header>

      <form class="composer" id="form-add" autocomplete="off">
        <input
          type="text"
          id="input-new"
          class="input-new"
          placeholder="添加新任务…"
          maxlength="200"
          aria-label="新任务内容"
        />
        <button type="submit" class="btn btn-primary">添加</button>
      </form>

      <div class="toolbar" role="tablist" aria-label="筛选">
        <button type="button" class="filter active" data-filter="all">全部</button>
        <button type="button" class="filter" data-filter="active">未完成</button>
        <button type="button" class="filter" data-filter="completed">已完成</button>
      </div>

      <ul class="list" id="list" aria-live="polite"></ul>

      <footer class="footer">
        <span class="count" id="count"></span>
        <button type="button" class="btn btn-ghost" id="btn-clear">清除已完成</button>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
